<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Museo</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=IM+Fell+English:ital@0;1&family=Pinyon+Script&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(circle at center,#1b1626 0%,#09070d 100%);color:#efe6d5;font:10px/1.6 "Press Start 2P",monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;overflow:hidden;touch-action:manipulation;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.top-bar{display:flex;align-items:center;justify-content:center;gap:10px;width:min(100vw - 12px,calc((100vh - 100px)*1.5))}
h1{font-family:"Cinzel",serif;font-weight:800;font-size:17px;letter-spacing:2px;margin:0;color:#f5d78e;text-align:center;flex:1;text-shadow:0 2px 10px rgba(245,215,142,.45),0 1px 2px #000}
h1 small{font-family:"Press Start 2P",monospace;display:block;font-size:7px;color:#a8c5e6;margin-top:3px;letter-spacing:1px;text-shadow:0 0 8px rgba(168,197,230,.5)}
.hud-btns{display:flex;gap:6px}
.hud-btn{background:rgba(24,18,36,.9);color:#f5d78e;border:2px solid #c8a35f;padding:5px 8px;font:inherit;font-size:8px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.6);border-radius:4px}
.hud-btn:active{transform:translateY(1px);background:#3b2d4a}
#c-wrap{position:relative;border:2px solid #c8a35f;box-shadow:0 0 0 2px #09070d,0 0 0 4px #5e4727,0 18px 45px rgba(0,0,0,.95),0 0 35px rgba(245,200,110,.15)}
#c{display:block;width:min(100vw - 12px,calc((100vh - 105px)*1.5));aspect-ratio:3/2;image-rendering:pixelated}
#np{font-size:8px;color:#ffd984;min-height:12px;text-shadow:0 0 8px rgba(255,217,132,.6);cursor:pointer}
#pad{position:fixed;left:14px;bottom:calc(14px + env(safe-area-inset-bottom));display:grid;grid-template:repeat(3,44px)/repeat(3,44px);gap:3px;z-index:3}
#pad button,#a{background:rgba(18,14,26,.88);color:#f5d78e;border:2px solid #c8a35f;box-shadow:0 4px 12px rgba(0,0,0,.7);font:inherit;font-size:12px;touch-action:none;user-select:none;backdrop-filter:blur(4px)}
#pad button:active,#a:active{background:#3b2d4a;transform:translateY(1px)}
#pad button:nth-child(1){grid-area:1/2}#pad button:nth-child(2){grid-area:2/1}#pad button:nth-child(3){grid-area:2/3}#pad button:nth-child(4){grid-area:3/2}
#a{position:fixed;right:18px;bottom:calc(30px + env(safe-area-inset-bottom));width:64px;height:64px;border-radius:50%;background:radial-gradient(circle,#8c2f4b,#4a1526);border-color:#e6b873;z-index:3}
@media(hover:hover) and (pointer:fine){#pad,#a{display:none}}

/* Modal */
#m{position:fixed;inset:0;background:rgba(5,4,10,.82);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:5;padding:8px}
#m.on{display:flex}
.p{background:linear-gradient(180deg,#1a1524 0%,#0f0c16 100%);border:2px solid #c8a35f;box-shadow:0 0 0 2px #000,0 0 0 4px #523c20,0 20px 50px #000;width:min(96vw,680px);max-height:88vh;display:flex;flex-direction:column}
.p header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:linear-gradient(90deg,#2c2038,#1b1424);border-bottom:2px solid #785c34;color:#f5d78e;gap:8px}
.p header button{background:#6e2236;color:#f5d78e;border:2px solid #c8a35f;font:inherit;padding:5px 8px;cursor:pointer}
#bd{overflow:auto;padding:14px;-webkit-overflow-scrolling:touch}
.hint{font-size:7px;line-height:1.9;color:#a8c5e6;margin:0 0 12px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:12px;margin-bottom:12px}
figure{margin:0;background:#14101d;border:2px solid #57442b;padding:6px;font-size:8px;box-shadow:inset 0 0 12px #000,0 4px 10px rgba(0,0,0,.5);transition:border-color .2s;cursor:pointer}
figure:hover{border-color:#c8a35f}
figure.big{grid-column:1/-1}
figure img,.ph{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;image-rendering:auto;border:1px solid #2e2418}
.ph{display:flex;align-items:center;justify-content:center;background:radial-gradient(#2c2038,#150f1d);color:#e69ab0;font-size:24px}
figcaption{margin-top:8px;color:#efe6d5}figcaption em{display:block;color:#9d8cb8;font-style:normal;margin-top:3px}
.pk{display:flex;align-items:center;gap:4px;margin-top:8px;font-size:7px;color:#9d8cb8}
.pk span{flex:1}
.pk button{width:22px;height:22px;background:#1e182b;color:#f5d78e;border:2px solid #57442b;font:inherit;font-size:8px;cursor:pointer;padding:0}
.pk button.on{background:#b83b5e;border-color:#f5d78e;color:#fff}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

/* Cartas: sobres y manuscritos */
.cl{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:16px}
.sob{position:relative;aspect-ratio:5/4;cursor:pointer;background:linear-gradient(165deg,#e2cf9e,#c8aa6c);border:1px solid #6e5430;box-shadow:0 6px 14px #000a,inset 0 0 16px rgba(90,60,20,.4);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:8px 6px 10px;text-align:center;color:#3a2410;font-family:"IM Fell English",serif;transition:transform .15s}
.sob:hover{transform:translateY(-3px) rotate(-1deg)}
.sob::before{content:"";position:absolute;inset:0 0 40% 0;background:linear-gradient(160deg,#d6c08a,#b99a5c);clip-path:polygon(0 0,100% 0,50% 100%)}
.sob .sl{position:absolute;left:50%;top:38%;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6,var(--s) 55%,#000 170%);box-shadow:0 2px 4px #0008,inset 0 0 0 2px rgba(0,0,0,.15);z-index:1}
.sob .sl::after{content:"♥";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:10px sans-serif;color:rgba(0,0,0,.35)}
.sob b,.sob small{position:relative;z-index:2}
.sob b{font-size:14px;font-weight:400;line-height:1.2}
.sob small{font-size:11px;color:#6b4a28;font-style:italic}
.ms{position:relative;margin-top:12px;padding:28px 26px 34px;color:#2b1a0e;font-family:"IM Fell English",serif;font-size:16px;line-height:1.85;background:radial-gradient(ellipse at 20% 8%,rgba(255,240,200,.6),transparent 55%),radial-gradient(ellipse at 92% 96%,rgba(120,70,20,.38),transparent 50%),repeating-linear-gradient(0deg,rgba(120,80,30,.06) 0 2px,transparent 2px 5px),#e6d3a3;box-shadow:inset 0 0 40px rgba(110,70,25,.6),0 8px 20px #000;border:1px solid #7a5a2c;animation:unroll .55s ease-out;clip-path:polygon(0 1%,3% 0,9% 1%,16% 0,25% 1%,34% 0,45% 1%,57% 0,68% 1%,80% 0,91% 1%,100% 0,100% 99%,94% 100%,83% 99%,70% 100%,58% 99%,44% 100%,31% 99%,18% 100%,7% 99%,0 100%)}
.ms::before{content:"";position:absolute;inset:10px;border:1px solid rgba(110,70,25,.45);box-shadow:inset 0 0 0 3px rgba(230,211,163,.9),inset 0 0 0 4px rgba(110,70,25,.3);pointer-events:none}
.ms h2{font-family:"Pinyon Script",cursive;font-weight:400;font-size:32px;line-height:1.2;margin:0 0 6px;color:#4a2a12;text-align:center}
.ms .fe{text-align:right;font-style:italic;font-size:13px;color:#6b4a28;margin-bottom:10px}
.ms p{margin:0 0 12px;text-align:justify;hyphens:auto}
.ms p:first-of-type::first-letter{float:left;font-family:"Pinyon Script",cursive;font-size:62px;line-height:.78;padding:6px 8px 0 0;color:#7a1f2f}
.ms .fi{font-family:"Pinyon Script",cursive;font-size:28px;text-align:right;color:#4a2a12;margin-top:18px}
.ms .seal{position:absolute;left:22px;bottom:18px;width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6,var(--s) 55%,#000 170%);box-shadow:0 3px 6px #0007}
.ms .seal::after{content:"♥";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:14px sans-serif;color:rgba(0,0,0,.35)}
.ms .pola{float:right;width:38%;margin:2px 0 10px 16px;padding:6px 6px 22px;background:#f4ecd8;border:1px solid #b5a07a;box-shadow:2px 4px 8px rgba(60,35,10,.5);transform:rotate(3deg);position:relative;cursor:default}
.ms .pola::before{content:"";position:absolute;top:-8px;left:50%;width:44px;height:14px;margin-left:-22px;background:rgba(220,200,140,.7);transform:rotate(-3deg)}
.ms .pola img,.ms .pola .ph{border:1px solid #8a7656}
@keyframes unroll{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
@media(prefers-reduced-motion:reduce){.ms{animation:none}}

/* Música */
.tr{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;background:#15111e;color:#efe6d5;border:2px solid #4d3b26;padding:10px;margin-bottom:8px;font:inherit;font-size:9px;cursor:pointer}
.tr.on{border-color:#f5d78e;color:#f5d78e;background:#241c30;box-shadow:0 0 12px rgba(245,215,142,.2)}.tr small{color:#9d8cb8;display:block;margin-top:4px}
iframe{width:100%;aspect-ratio:16/9;border:2px solid #785c34;margin-top:6px}
.vol{width:100%;margin-top:8px;accent-color:#f5d78e}

/* Logros */
.mp{height:min(50vh,360px);overflow:auto;background:#14101c radial-gradient(#292038 1px,transparent 1px) 0 0/16px 16px;border:2px solid #57442b;position:relative;box-shadow:inset 0 0 30px #000}
.mp svg{position:absolute;left:0;top:0;pointer-events:none}.mp path{fill:none;stroke:#3a3147;stroke-width:5}.mp path.ok{stroke:#f5d78e;filter:drop-shadow(0 0 4px #f5d78e)}
.nd{position:absolute;width:54px;height:54px;border:3px solid #3a3147;background:#1c1626;font-size:20px;color:#f5d78e;display:flex;align-items:center;justify-content:center;padding:0;filter:grayscale(1) brightness(.5);cursor:pointer;box-shadow:0 4px 10px #000;overflow:hidden}
.nd img,.nd .ph{width:100%;height:100%;object-fit:cover;border:none;aspect-ratio:1/1}
.nd.ok{border-color:#f5d78e;background:radial-gradient(#423154,#1e1629);filter:none;box-shadow:0 0 12px rgba(245,215,142,.45)}
.nd.sel{outline:2px solid #fff;outline-offset:2px}
#inf{margin-top:8px;font-size:9px;background:#14101d;border:2px solid #57442b;padding:10px;min-height:76px;display:flex;gap:12px;align-items:center}
#inf .inf-img{width:56px;height:56px;flex-shrink:0;border:2px solid #c8a35f;overflow:hidden;background:#1c1626;display:flex;align-items:center;justify-content:center}
#inf .inf-img img,#inf .inf-img .ph{width:100%;height:100%;object-fit:cover;border:none}
#inf .inf-txt{flex:1;line-height:1.7}
.fecha-tag{display:inline-block;color:#a8c5e6;background:#1e182b;border:1px solid #4a3e66;padding:2px 6px;font-size:7px;margin-top:4px}
.dlg-box{background:#0b0912;border:3px solid #fff;padding:14px;font-size:10px;line-height:1.8;color:#fff;box-shadow:inset 0 0 0 2px #000}

/* Tablón de misiones */
.tabs{display:flex;gap:8px;margin-bottom:10px}
.tab{background:#15111e;color:#9d8cb8;border:2px solid #4d3b26;font:inherit;font-size:8px;padding:8px 10px;cursor:pointer}
.tab.on{color:#f5d78e;border-color:#f5d78e;background:#241c30}
.tb{padding:18px 14px 14px;border:6px solid #3b271b;box-shadow:inset 0 0 25px #000a,0 0 0 2px #000;background:radial-gradient(rgba(60,35,15,.55) 1px,transparent 1.5px) 0 0/6px 6px,radial-gradient(ellipse at 30% 20%,#9a7248,#7a5632 70%)}
.qs{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:20px 14px}
.q{position:relative;background:#e9d9ae;color:#2b1a0e;font-family:"IM Fell English",serif;padding:16px 10px 10px;transform:rotate(var(--r));box-shadow:2px 6px 9px #0009,inset 0 0 14px rgba(120,80,30,.35);cursor:pointer;transition:transform .15s}
.q:hover,.q.sel{transform:rotate(0) scale(1.04);z-index:2}
.q.sel{outline:2px solid #b83b5e}
.q::before{content:"";position:absolute;top:-5px;left:50%;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff9aa8,#b83b5e 60%,#5a1426);box-shadow:0 2px 3px #0008}
.q b{display:block;font-size:14px;font-weight:400;line-height:1.25;margin-bottom:4px}
.q small{font-size:11px;font-style:italic;color:#6b4a28;display:block}
.q .rk{position:absolute;top:8px;right:6px;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:8px "Press Start 2P",monospace;color:#fff;background:var(--k);box-shadow:inset 0 0 0 2px rgba(0,0,0,.25)}
.q.done{filter:sepia(.35) brightness(.92)}
.q.done::after{content:"CUMPLIDA";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-12deg);font:8px "Press Start 2P",monospace;color:#2f7a4f;border:2px solid #2f7a4f;padding:4px 6px;background:rgba(233,217,174,.6)}
.vacio{grid-column:1/-1;text-align:center;font-family:"IM Fell English",serif;font-size:15px;color:#e9d9ae;padding:20px}
#qi{margin-top:10px;background:#14101d;border:2px solid #57442b;padding:12px;font-size:8px;line-height:1.9;min-height:70px}
#qi h3{margin:0 0 6px;font:800 15px "Cinzel",serif;color:#f5d78e}
#qi .st{display:flex;gap:6px;align-items:center;margin:3px 0}
.bar{height:8px;background:#2a2236;border:1px solid #57442b;margin:8px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,#b83b5e,#f5d78e)}
</style>
</head>
<body>
<div class="top-bar">
  <h1 id="ti"></h1>
  <div class="hud-btns">
    <button class="hud-btn" id="btn-bgm" title="Música (tecla M)">🔇 Música</button>
    <button class="hud-btn" id="btn-fit" title="Cambiar look (tecla C)">👗 Look 3</button>
  </div>
</div>
<div id="c-wrap"><canvas id="c"></canvas></div>
<div id="np" title="Activar o pausar la música">♪ Toca cualquier tecla o aquí para iniciar la música</div>
<div id="pad"><button data-k="arrowup">▲</button><button data-k="arrowleft">◀</button><button data-k="arrowright">▶</button><button data-k="arrowdown">▼</button></div>
<button id="a">A</button>
<div id="m"><div class="p"><header><span id="t"></span><button onclick="cerrar()">X</button></header><div id="bd"></div></div></div>
<script src="contenido.js"></script>
<script src="arte.js"></script>
<script>
const C=window.CONTENIDO,$=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const im=(s,c,fb)=>s?`<img class="${c||''}" src="${esc(s)}" alt="" onerror="this.outerHTML='<div class=ph>${fb||'♥'}</div>'">`:`<div class="ph">${fb||'♥'}</div>`;
$('#ti').innerHTML=`${esc(C.museo.titulo)}<small>${esc(C.museo.sub)}</small>`;document.title=C.museo.titulo;
const cv=$('#c'),x=cv.getContext('2d');cv.width=W*T;cv.height=H*T;x.imageSmoothingEnabled=false;
g=x;initArt();
let modal=0;
function abrir(t,h,fn){$('#t').textContent=t;$('#bd').innerHTML=h;$('#m').classList.add('on');modal=1;fn&&fn()}
function cerrar(){$('#m').classList.remove('on');modal=0;$('#bd').innerHTML=''}

/* ================= MÚSICA (mp3 en bucle; si no existe, melodía de piano integrada) ================= */
const au=new Audio();
let cur=-1,bgmStarted=0,bgmMuted=0,usingSynth=0,actx=null,synthTimer=null,synthStep=0,masterVol=(C.musicaPrincipal&&C.musicaPrincipal.volumen!=null)?C.musicaPrincipal.volumen:0.5;
au.volume=masterVol;
const MELODY=[523.25,659.25,783.99,1046.50,783.99,659.25,493.88,659.25,783.99,987.77,783.99,659.25,440.00,523.25,659.25,880.00,659.25,523.25,392.00,493.88,587.33,783.99,587.33,493.88,349.23,440.00,523.25,698.46,523.25,440.00,329.63,392.00,523.25,659.25,523.25,392.00,293.66,349.23,440.00,587.33,440.00,349.23,392.00,493.88,587.33,783.99,880.00,987.77];
function playSynthNote(freq,dur){
  if(!actx||bgmMuted||!usingSynth)return;
  if(actx.state==='suspended')actx.resume();
  const o1=actx.createOscillator(),o2=actx.createOscillator(),gn=actx.createGain();
  o1.type='sine';o2.type='triangle';o1.frequency.value=freq;o2.frequency.value=freq*2;
  const now=actx.currentTime,v=Math.max(0.0001,masterVol*0.22);
  gn.gain.setValueAtTime(0.0001,now);gn.gain.exponentialRampToValueAtTime(v,now+0.03);gn.gain.exponentialRampToValueAtTime(0.0001,now+dur);
  o1.connect(gn);o2.connect(gn);gn.connect(actx.destination);
  o1.start(now);o2.start(now);o1.stop(now+dur+0.05);o2.stop(now+dur+0.05);
}
function startSynthBgm(){
  stopSynthBgm();
  if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();
  if(actx.state==='suspended')actx.resume();
  usingSynth=1;bgmStarted=1;updateNp();
  synthTimer=setInterval(()=>{
    if(bgmMuted||!usingSynth)return;
    const f=MELODY[synthStep%MELODY.length];
    playSynthNote(f,1.3);if(synthStep%6===0)playSynthNote(f*0.5,2.4);synthStep++;
  },360);
}
function stopSynthBgm(){usingSynth=0;if(synthTimer){clearInterval(synthTimer);synthTimer=null}}
function isMusicPlaying(){return(!au.paused&&au.currentTime>0)||(usingSynth&&!bgmMuted)}
function updateNp(){
  if(!isMusicPlaying()){$('#np').textContent='🔇 Música en pausa (toca aquí o presiona M)';$('#btn-bgm').textContent='🔇 Música';return}
  $('#btn-bgm').textContent='🔊 Música';
  if(cur==-1)$('#np').textContent='♪ '+((C.musicaPrincipal&&C.musicaPrincipal.titulo)||'Caja de Música');
  else if(C.musica[cur])$('#np').textContent='♪ '+C.musica[cur].titulo;
}
function playBgm(){
  cur=-1;stopSynthBgm();
  const mp=C.musicaPrincipal;
  if(mp&&mp.archivo){
    au.loop=true;au.src=mp.archivo;au.volume=masterVol;
    if(!bgmMuted)au.play().then(()=>{bgmStarted=1;updateNp()}).catch(()=>{if(!bgmMuted)startSynthBgm()});
  }else if(!bgmMuted)startSynthBgm();
}
au.onerror=()=>{if(cur==-1&&!bgmMuted)startSynthBgm()};
function unlockAudio(){
  if(!bgmStarted&&!bgmMuted)playBgm();
  else if(actx&&actx.state==='suspended'&&!bgmMuted)actx.resume();
}
['pointerdown','keydown','touchstart'].forEach(ev=>addEventListener(ev,unlockAudio));
function toggleBgm(){
  if(isMusicPlaying()){bgmMuted=1;au.pause();stopSynthBgm();updateNp()}
  else{
    bgmMuted=0;
    if(cur==-1)playBgm();
    else if(C.musica[cur]&&C.musica[cur].archivo)au.play().then(updateNp).catch(()=>startSynthBgm());
    else playBgm();
  }
}
$('#btn-bgm').onclick=toggleBgm;$('#np').onclick=toggleBgm;
function play(i){
  if(i==-1){bgmMuted=0;playBgm();musica();return}
  stopSynthBgm();
  const m=C.musica[i];cur=i;au.loop=false;
  if(m.archivo){
    au.src=m.archivo;bgmMuted=0;
    au.play().then(updateNp).catch(()=>{$('#np').textContent='⚠ No se encontró '+m.archivo+' (usando melodía del museo)';startSynthBgm()});
  }else{au.pause();updateNp()}
  musica();
}
au.onended=()=>{if(cur>=0&&C.musica.length)play((cur+1)%C.musica.length)};

/* ================= ÁLBUM Y CUADROS FAVORITOS ================= */
const LS='museo_favs';let favSel=[null,null,null];
try{const v=JSON.parse(localStorage.getItem(LS));if(Array.isArray(v)&&v.length==3)favSel=v}catch(e){}
const saveFav=()=>{try{localStorage.setItem(LS,JSON.stringify(favSel))}catch(e){}};
function favData(i){const f=C.fotos[favSel[i]];return f?{src:f.src,titulo:f.titulo,texto:f.texto||f.fecha||''}:C.favoritas[i]}
function ponerFav(j,i){if(favSel[j]===i)favSel[j]=null;else{favSel=favSel.map(v=>v===i?null:v);favSel[j]=i}saveFav()}
const IMC={};const getImg=s=>IMC[s]||(IMC[s]=Object.assign(new Image(),{src:s}));
function album(keep){
  const sc=keep?$('#bd').scrollTop:0;
  abrir('Álbum de fotos','<p class="hint">Toca una foto para verla grande. Con los botones 1 · 2 · 3 eliges en qué cuadro del pasillo se cuelga (se guarda en este navegador).</p><div class="g">'+C.fotos.map((f,i)=>`<figure data-i="${i}">${im(f.src)}<figcaption>${esc(f.titulo)}<em>${esc(f.fecha)}</em></figcaption><div class="pk"><span>Cuadro</span>${[0,1,2].map(j=>`<button data-s="${j}" class="${favSel[j]===i?'on':''}">${j+1}</button>`).join('')}</div></figure>`).join('')+'</div><button class="hud-btn" id="rs">Restablecer cuadros</button>',()=>{
    document.querySelectorAll('figure').forEach(f=>f.onclick=e=>{if(!e.target.closest('.pk'))f.classList.toggle('big')});
    document.querySelectorAll('.pk button').forEach(b=>b.onclick=e=>{e.stopPropagation();ponerFav(+b.dataset.s,+b.closest('figure').dataset.i);album(1)});
    $('#rs').onclick=()=>{favSel=[null,null,null];saveFav();album(1)};
    $('#bd').scrollTop=sc});
}
function fav(i){const f=favData(i);
  abrir(f.titulo,`<figure class="big" style="cursor:default">${im(f.src)}<figcaption>${esc(f.texto)}</figcaption></figure><div class="btnrow"><button class="hud-btn" id="ch">Cambiar la foto de este cuadro</button></div>`,()=>{$('#ch').onclick=()=>elegir(i)});
}
function elegir(i){
  abrir('Elige la foto del cuadro '+(i+1),'<div class="g">'+C.fotos.map((f,k)=>`<figure data-k="${k}">${im(f.src)}<figcaption>${esc(f.titulo)}</figcaption></figure>`).join('')+'</div><button class="hud-btn" id="or">Usar la foto original</button>',()=>{
    document.querySelectorAll('figure').forEach(f=>f.onclick=()=>{favSel=favSel.map(v=>v===+f.dataset.k?null:v);favSel[i]=+f.dataset.k;saveFav();fav(i)});
    $('#or').onclick=()=>{favSel[i]=null;saveFav();fav(i)}});
}

/* ================= CARTAS (manuscritos) ================= */
const RAR={comun:['#8a2a2a','Común'],rara:['#2d4f8a','Rara'],epica:['#6a3a9a','Épica'],legendaria:['#c89d2a','Legendaria']};
function cartas(){
  abrir('Cartas y manuscritos','<div class="cl">'+C.cartas.map((c,i)=>{const r=RAR[c.rareza]||RAR.comun;return `<div class="sob" data-i="${i}" style="--s:${r[0]}"><span class="sl"></span><b>${esc(c.titulo)}</b><small>${r[1]}</small></div>`}).join('')+'</div>',()=>{
    document.querySelectorAll('.sob').forEach(d=>d.onclick=()=>leer(+d.dataset.i))});
}
function leer(i){
  const c=C.cartas[i],r=RAR[c.rareza]||RAR.comun,ps=String(c.texto||'').split(/\n+/).map(p=>`<p>${esc(p)}</p>`).join('');
  abrir(c.titulo,`<button class="hud-btn" id="bk">◀ Volver a las cartas</button><article class="ms" style="--s:${r[0]}">${c.imagen?`<figure class="pola">${im(c.imagen)}</figure>`:''}<h2>${esc(c.titulo)}</h2>${c.fecha?`<div class="fe">${esc(c.fecha)}</div>`:''}${ps}<div class="fi">${esc(c.firma||'Con amor')}</div><span class="seal"></span></article>`,()=>{$('#bk').onclick=cartas});
}

/* ================= MÚSICA (gramófono) ================= */
function musica(){
  const yt=cur>=0&&C.musica[cur].yt,bgmOn=(cur==-1&&isMusicPlaying()),bt=(C.musicaPrincipal&&C.musicaPrincipal.titulo)||'Tema Principal del Museo';
  const bgmBtn=`<button class="tr ${bgmOn?'on':''}" id="tr-bgm"><span>★ ${esc(bt)}<small>${usingSynth?'Melodía de piano integrada':'Música de fondo del museo'}</small></span><span>${bgmOn?'♪':'▶'}</span></button>`;
  abrir('Selector de música',bgmBtn+C.musica.map((m,i)=>`<button class="tr ${i==cur?'on':''}" data-i="${i}"><span>${esc(m.titulo)}<small>${esc(m.artista)}</small></span><span>${i==cur&&isMusicPlaying()?'♪':'▶'}</span></button>`).join('')+(yt?`<iframe src="https://www.youtube-nocookie.com/embed/${esc(C.musica[cur].yt)}?autoplay=1" allow="autoplay;encrypted-media" allowfullscreen></iframe>`:'')+'<input class="vol" type="range" min="0" max="1" step=".05" value="'+masterVol+'">',()=>{
    $('#tr-bgm').onclick=()=>{if(cur==-1)toggleBgm();else play(-1);musica()};
    document.querySelectorAll('.tr[data-i]').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(i==cur&&C.musica[i].archivo){toggleBgm();musica()}else play(i)});
    $('.vol').oninput=e=>{masterVol=+e.target.value;au.volume=masterVol}});
}

/* ================= LOGROS (mapa estilo Minecraft) ================= */
function logros(){
  const L=C.logros,S=84,by=Object.fromEntries(L.map(l=>[l.id,l]));let w=0,h=0,ln='';
  L.forEach(l=>{w=Math.max(w,l.x);h=Math.max(h,l.y);const p=by[l.padre];if(p){const a=p.x*S+56,b=p.y*S+56,c=l.x*S+56,d=l.y*S+56,mx=(a+c)/2;ln+=`<path class="${p.logrado&&l.logrado?'ok':''}" d="M${a} ${b}H${mx}V${d}H${c}"/>`}});
  const W2=(w+1)*S+60,H2=(h+1)*S+60,n=L.filter(l=>l.logrado).length;
  abrir(`Logros ${n}/${L.length}`,`<div class="mp"><div style="position:relative;width:${W2}px;height:${H2}px"><svg width="${W2}" height="${H2}">${ln}</svg>`+L.map((l,i)=>{const hid=l.oculto&&!l.logrado;return `<button class="nd ${l.logrado?'ok':''}" data-i="${i}" style="left:${l.x*S+30}px;top:${l.y*S+30}px">${hid?'?':im(l.imagen,'',l.icono||'♥')}</button>`}).join('')+'</div></div><div id="inf"><div class="inf-txt">Toca un logro en el mapa para ver su foto, fecha y detalles.</div></div>',()=>{
    document.querySelectorAll('.nd').forEach(b=>b.onclick=()=>{
      document.querySelectorAll('.nd').forEach(o=>o.classList.remove('sel'));b.classList.add('sel');
      const l=L[+b.dataset.i],hid=l.oculto&&!l.logrado,thumb=hid?'<div class="ph">?</div>':im(l.imagen,'',l.icono||'♥'),fh=(!hid&&l.fecha)?`<div class="fecha-tag">📅 ${esc(l.fecha)}</div>`:'';
      $('#inf').innerHTML=`<div class="inf-img">${thumb}</div><div class="inf-txt"><b style="color:${l.logrado?'#f5d78e':'#9d8cb8'}">${hid?'???':esc(l.titulo)}</b> <span style="font-size:7px;color:${l.logrado?'#9fd6b0':'#9a8cbc'}">[${l.logrado?'¡Logrado!':'Pendiente'}]</span><br>${hid?'Logro secreto por descubrir.':esc(l.desc)}<br>${fh}</div>`})});
}

/* ================= TABLÓN DE MISIONES (Sala de planes) ================= */
const ICO={viaje:'✈️',casa:'🏡',aventura:'⚔️',comida:'🍜',sueno:'✨',amor:'💖'},RK={S:'#c89d2a',A:'#b83b5e',B:'#3b6998',C:'#4f9a6a'};
let qTab=0;
function tablon(sel){
  const P=C.planes||[],pend=P.filter(p=>!p.hecho),done=P.filter(p=>p.hecho),list=qTab?done:pend;
  abrir('Tablón de misiones',`<div class="tabs"><button class="tab ${qTab?'':'on'}" data-t="0">Pendientes (${pend.length})</button><button class="tab ${qTab?'on':''}" data-t="1">Cumplidas (${done.length})</button></div><div class="tb"><div class="qs">`+(list.length?list.map(p=>{const i=P.indexOf(p);return `<div class="q ${p.hecho?'done':''} ${sel===i?'sel':''}" data-i="${i}" style="--r:${((i*37)%7-3)*.8}deg;--k:${RK[p.rango]||RK.C}"><span class="rk">${esc(p.rango||'C')}</span><b>${ICO[p.tipo]||'📜'} ${esc(p.titulo)}</b><small>${esc(p.fecha||'')}</small></div>`}).join(''):'<div class="vacio">Aquí todavía no hay misiones…</div>')+'</div></div><div id="qi">Toca una misión para ver sus detalles.</div>',()=>{
    document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{qTab=+b.dataset.t;tablon()});
    document.querySelectorAll('.q').forEach(q=>q.onclick=()=>{
      document.querySelectorAll('.q').forEach(o=>o.classList.remove('sel'));q.classList.add('sel');
      const p=P[+q.dataset.i],ps=(p.pasos||[]).map(s=>typeof s=='string'?{t:s,ok:false}:s),n=ps.filter(s=>s.ok).length;
      $('#qi').innerHTML=`<h3>${ICO[p.tipo]||'📜'} ${esc(p.titulo)}</h3>${esc(p.desc||'')}<br>${p.recompensa?`<br>🎁 Recompensa: ${esc(p.recompensa)}`:''}${p.fecha?`<br>📅 ${esc(p.fecha)}`:''}${ps.length?`<div class="bar"><i style="width:${n/ps.length*100}%"></i></div>`+ps.map(s=>`<div class="st">${s.ok?'☑':'☐'} ${esc(s.t)}</div>`).join(''):''}`});
    if(sel!=null){const q=document.querySelector(`.q[data-i="${sel}"]`);q&&q.click()}});
}

/* ================= NPC ================= */
const FRASES_NPC=C.frases||["¡Hola mi amor! ♥"];
let fraseIdx=0;
const npc={x:14*T,y:10*T,d:3,mv:0,timer:60,heartTimer:0};
function hablarNpc(){
  const dx=px-npc.x,dy=py-npc.y;
  npc.d=Math.abs(dx)>Math.abs(dy)?(dx<0?1:2):(dy<0?0:3);npc.mv=0;npc.timer=140;npc.heartTimer=90;
  abrir('Tu Novio ♥',`<div class="dlg-box">“${esc(FRASES_NPC[fraseIdx++%FRASES_NPC.length])}”</div>`);
}

/* ================= SALAS, COLISIONES Y MOVIMIENTO ================= */
const ST=[{x:3,y:8,n:'Álbum de fotos',f:()=>album(),k:'album'},{x:19,y:8,n:'Cartas y manuscritos',f:cartas,k:'cartas'},{x:3,y:12,n:'Música',f:musica,k:'musica'},{x:19,y:12,n:'Logros',f:logros,k:'logros'}];
const DECA=[{x:1,y:2,w:1,h:1,k:'pl'},{x:22,y:2,w:1,h:1,k:'pl'},{x:1,y:14,w:1,h:1,k:'pl'},{x:22,y:14,w:1,h:1,k:'pl'},{x:10,y:14,w:2,h:1,k:'bn'}];
const DECB=[{x:1,y:3,w:1,h:1,k:'pl'},{x:22,y:3,w:1,h:1,k:'pl'},{x:22,y:14,w:1,h:1,k:'pl'},{x:1,y:14,w:1,h:1,k:'pl'},{x:5,y:8,w:2,h:1,k:'gb'},{x:17,y:8,w:2,h:1,k:'tb2'}];
const RM=[
 {name:'Sala principal',wall:wallA,dec:DECA,solid:ST.concat(DECA),
  it:ST.map(s=>({cx:(s.x+1)*T,cy:(s.y+1)*T,n:s.n,f:s.f})).concat([3,10,17].map((fx,i)=>({cx:(fx+1)*T,cy:2*T,hw:8,n:'Foto favorita '+(i+1),f:()=>fav(i)})))},
 {name:'Sala de planes',wall:wallB,dec:DECB,solid:DECB,it:[{cx:192,cy:3*T+4,hw:52,n:'Tablón de misiones',f:()=>tablon()}]}
];
let room=0,trans=null,toast=null;
let px=11.5*T,py=8*T,fr=0,dir=3,mv=0,outfit=2;
const FITN=['👗 Look 1','👗 Look 2','🧥 Look 3'];
$('#btn-fit').textContent=FITN[outfit];
function toggleOutfit(){outfit=(outfit+1)%3;$('#btn-fit').textContent=FITN[outfit]}
$('#btn-fit').onclick=toggleOutfit;
const key={};
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(k=='escape')cerrar();
  if((k=='e'||k==' '||k=='enter')&&!modal&&!e.repeat)act();
  if(k=='c'&&!modal&&!e.repeat)toggleOutfit();
  if(k=='m'&&!modal&&!e.repeat)toggleBgm();
  key[k]=1;
  if(!modal&&(k.startsWith('arrow')||k==' '))e.preventDefault();
});
addEventListener('keyup',e=>key[e.key.toLowerCase()]=0);
document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k;b.onpointerdown=e=>{e.preventDefault();unlockAudio();key[k]=1};['pointerup','pointerleave','pointercancel'].forEach(v=>b['on'+v]=()=>key[k]=0)});
$('#a').onclick=()=>{unlockAudio();if(!modal)act()};
function near(){
  let b=null,bd=34;
  RM[room].it.forEach(t=>{const d=Math.hypot(Math.max(0,Math.abs(px+6-t.cx)-(t.hw||0)),py+8-t.cy);if(d<bd){bd=d;b=t}});
  if(room==0){const dn=Math.hypot(px-npc.x,py-npc.y);if(dn<28&&dn<bd)b={cx:npc.x+6,cy:npc.y,n:'Hablar ♥',f:hablarNpc}}
  return b;
}
function act(){const t=near();if(t)t.f()}
function hit(nx,ny,isNpc){
  const rm=RM[room];
  for(const[cx,cy]of[[nx+2,ny+6],[nx+9,ny+6],[nx+2,ny+11],[nx+9,ny+11]])if(rm.wall(cx>>4,cy>>4))return 1;
  for(const s of rm.solid)if(nx+9>s.x*T&&nx+2<(s.x+(s.w||2))*T&&ny+11>s.y*T&&ny+6<(s.y+(s.h||2))*T)return 1;
  if(room==0){if(isNpc&&Math.hypot(nx-px,ny-py)<13)return 1;if(!isNpc&&Math.hypot(nx-npc.x,ny-npc.y)<11)return 1}
  return 0;
}
function go(r,sx,sy){trans={t:0,r,sx,sy}}
function step(){
  mv=0;
  if(trans){trans.t++;if(trans.t==10){room=trans.r;px=trans.sx;py=trans.sy;toast={t:140,txt:RM[room].name}}if(trans.t>=20)trans=null;return}
  if(toast&&--toast.t<=0)toast=null;
  if(modal)return;
  const dx=(key.arrowright||key.d?1:0)-(key.arrowleft||key.a?1:0),dy=(key.arrowdown||key.s?1:0)-(key.arrowup||key.w?1:0);
  if(dx||dy){
    mv=1;const sp=1.3,k=dx&&dy?.71:1;
    if(!hit(px+dx*sp*k,py,0))px+=dx*sp*k;
    if(!hit(px,py+dy*sp*k,0))py+=dy*sp*k;
    dir=dy>0?3:dy<0?0:dx<0?1:2;
  }
  if(room==0&&px+6>W*T-5)go(1,2*T+2,10.5*T-8);
  else if(room==1&&px+6<5)go(0,(W-3)*T,10.5*T-8);
  if(room!=0)return;
  if(npc.heartTimer>0)npc.heartTimer--;
  if(--npc.timer<=0){
    if(npc.mv){npc.mv=0;npc.timer=50+((Math.random()*90)|0)}
    else{npc.mv=1;npc.d=(Math.random()*4)|0;npc.timer=35+((Math.random()*65)|0)}
  }
  if(npc.mv){
    const ndx=npc.d==2?1:npc.d==1?-1:0,ndy=npc.d==3?1:npc.d==0?-1:0,ns=0.65;
    if(!hit(npc.x+ndx*ns,npc.y+ndy*ns,1)){npc.x+=ndx*ns;npc.y+=ndy*ns}else{npc.mv=0;npc.timer=25}
  }
}

/* ================= DIBUJO ================= */
const PTS=Array.from({length:34},(_,i)=>({x:Math.random()*W*T,y:Math.random()*H*T,s:Math.random()*.25+.1,p:Math.random()*6.28,c:i%3==0?'#9ec5ff':'#ffe49e'}));
function draw(){
  const rm=RM[room],S=ART.S;
  x.drawImage(ART.bg[room],0,0);
  if(room==0)[3,10,17].forEach((fx,i)=>{
    const a=fx*T,d=favData(i),m=getImg(d.src);
    R(SHD,a+1,25,31,4);
    bb(a,1,32,24,'#9e7324','#f2c24d','#593d10');R('#d9a74a',a+2,3,28,20);R('#f2d27a',a+2,3,28,1);R('#2b1d14',a+3,4,26,18);R('#efe6d5',a+4,5,24,16);R('#1c1524',a+5,6,22,14);
    R('#c89d54',a+1,2,3,3);R('#c89d54',a+28,2,3,3);R('#c89d54',a+1,21,3,3);R('#c89d54',a+28,21,3,3);
    if(m&&m.complete&&m.naturalWidth){const iw=m.naturalWidth,ih=m.naturalHeight,r=Math.max(22/iw,14/ih),sw=22/r,sh=14/r;x.drawImage(m,(iw-sw)/2,(ih-sh)/2,sw,sh,a+5,6,22,14)}
    else{R('#261c33',a+5,6,22,14);heart(a+9,8,'#d96b8a',2)}
    bb(a+10,26,12,4,'#b8862d','#ffe49e','#593d10');R('#593d10',a+15,27,2,2);
  });
  const q=[],on=isMusicPlaying();
  if(room==0)ST.forEach(s=>q.push([s.y*T+30,()=>{
    const a=s.x*T,b=s.y*T;R(SHD,a+2,b+27,28,5);x.drawImage(S[s.k],a,b);
    if(s.k=='musica'&&on)for(let i=0;i<2;i++){x.fillStyle=i?'#9ec5ff':'#ffe49e';x.font='8px "Press Start 2P",monospace';x.textBaseline='top';x.fillText('♪',a+6+i*12,b-6-((fr/5+i*7)%12))}
    if(s.k=='logros'){const p=[[23,5],[9,10],[21,14],[12,4]][fr>>3&3];R('#fff',a+p[0],b+p[1],1,1);R('#ffe49e',a+p[0]-1,b+p[1],3,1);R('#ffe49e',a+p[0],b+p[1]-1,1,3)}
    if(s.k=='cartas'){R(fr>>3&1?'#ffd24a':'#ffb03a',a+5,b+2,1,1)}
  }]));
  rm.dec.forEach(s=>q.push([(s.y+s.h)*T,()=>{const k=S[s.k];R(SHD,s.x*T+1,(s.y+s.h)*T-3,s.w*T-2,4);x.drawImage(k,s.x*T,(s.y+s.h)*T-k.height)}]));
  if(room==0)q.push([npc.y+12,()=>{
    R(SHD,npc.x|0,(npc.y|0)+9,12,4);x.drawImage(ART.BOY[npc.d][npc.mv?[0,1,0,2][fr>>3&3]:0],(npc.x|0)-3,(npc.y|0)-12);
    if(npc.heartTimer>0||Math.hypot(px-npc.x,py-npc.y)<28)heart((npc.x|0)+3,((npc.y|0)-20-Math.sin(fr*.1)*1.5)|0,'#ff6b8b',1);
  }]);
  q.push([py+12,()=>{R(SHD,px|0,(py|0)+9,12,4);x.drawImage(ART.GIRL[outfit][dir][mv?[0,1,0,2][fr>>3&3]:0],(px|0)-3,(py|0)-12)}]);
  q.sort((a,b)=>a[0]-b[0]).forEach(o=>o[1]());
  x.drawImage(ART.light[room],0,0);
  const pg=x.createRadialGradient(px+6,py+2,2,px+6,py+2,42);pg.addColorStop(0,'rgba(255,215,145,.18)');pg.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=pg;x.fillRect(px-38,py-40,88,88);
  PTS.forEach(p=>{p.y-=p.s;p.x+=Math.sin(fr*.02+p.p)*.15;if(p.y<0){p.y=H*T;p.x=Math.random()*W*T}x.fillStyle=p.c;x.globalAlpha=Math.max(0,.35+Math.sin(fr*.05+p.p)*.35);x.fillRect(p.x|0,p.y|0,1,1)});
  x.globalAlpha=1;
  const t=near();
  if(t&&!modal){
    const w=t.n.length*6+18,bx0=Math.max(4,Math.min(W*T-w-4,t.cx-w/2|0)),by0=t.cy<60?t.cy+16:t.cy-44;
    R('rgba(0,0,0,.65)',bx0+1,by0+2,w+2,16);R('#c8a35f',bx0-1,by0-1,w+2,16);R('#16111f',bx0,by0,w,14);R('#2c213b',bx0,by0,w,2);
    x.fillStyle='#f5d78e';x.font='6px "Press Start 2P",monospace';x.textBaseline='top';x.fillText(t.n,bx0+6,by0+4);R('#e66c8a',bx0+w-7,by0+5+(fr>>4&1),3,3);
  }
  if(toast){const w=toast.txt.length*6+20,a=Math.min(1,toast.t/20),bx0=(W*T-w)/2|0;x.globalAlpha=a;R('#c8a35f',bx0-1,7,w+2,16);R('#16111f',bx0,8,w,14);x.fillStyle='#f5d78e';x.font='6px "Press Start 2P",monospace';x.textBaseline='top';x.fillText(toast.txt,bx0+10,12);x.globalAlpha=1}
  if(trans){x.fillStyle='rgba(5,3,10,'+(trans.t<10?trans.t/10:(20-trans.t)/10)+')';x.fillRect(0,0,W*T,H*T)}
}
(function loop(){fr++;step();draw();requestAnimationFrame(loop)})();
</script>
